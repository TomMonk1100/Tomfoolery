<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Garden</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070f;}
  canvas{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
// A quiet place. Stars, a moon, hills, grass that breathes, fireflies.
// No goals, no score. Just weather.
(function(){
  const cv = document.getElementById('g');
  const ctx = cv.getContext('2d');
  let W, H, stars = [], flies = [], blades = [], hills = [];
  const mouse = {x:-9999, y:-9999};

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rnd = mulberry32(20260929);

  function build(){
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    stars = [];
    const n = Math.floor(W*H/9000);
    for(let i=0;i<n;i++) stars.push({x:rnd()*W, y:rnd()*H*0.62, r:rnd()*1.3+0.3, p:rnd()*Math.PI*2, s:0.4+rnd()*1.2});
    flies = [];
    for(let i=0;i<26;i++) flies.push(newFly(true));
    blades = [];
    const bn = Math.floor(W/7);
    for(let i=0;i<bn;i++) blades.push({x:rnd()*W, h:26+rnd()*70, p:rnd()*Math.PI*2, s:0.5+rnd()*0.9, hue:95+rnd()*40});
    hills = [];
    for(let l=0;l<3;l++){
      const pts=[]; const base=H*(0.66+l*0.11); const amp=26+l*34; const f=0.0016+l*0.0011; const off=rnd()*10;
      for(let x=0;x<=W;x+=8) pts.push(base + Math.sin(x*f+off)*amp + Math.sin(x*f*2.7+off*2)*amp*0.3);
      hills.push({pts, c:['#0b1226','#0d152b','#101a33'][l]});
    }
  }
  function newFly(anywhere){
    return {x:rnd()*W, y:H*0.35+rnd()*H*0.6, vx:(rnd()-0.5)*0.35, vy:(rnd()-0.5)*0.3,
            p:rnd()*Math.PI*2, s:0.6+rnd()*1.4, r:1.4+rnd()*1.8, a:anywhere?rnd():0};
  }

  let t = 0, shoot = null, nextShoot = 400+rnd()*500;
  function frame(){
    t++;
    // sky
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#04060d'); sky.addColorStop(0.55,'#0a1024'); sky.addColorStop(1,'#0d1428');
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
    // stars
    for(const st of stars){
      const tw = 0.35 + 0.65*Math.abs(Math.sin(t*0.01*st.s + st.p));
      ctx.globalAlpha = tw*0.9; ctx.fillStyle = '#dfe8ff';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // moon
    const mx=W*0.78, my=H*0.2, mr=Math.min(W,H)*0.055;
    const glow = ctx.createRadialGradient(mx,my,mr*0.4,mx,my,mr*4);
    glow.addColorStop(0,'rgba(235,240,255,0.28)'); glow.addColorStop(1,'rgba(235,240,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(mx,my,mr*4,0,7); ctx.fill();
    ctx.fillStyle = '#e8edfb'; ctx.beginPath(); ctx.arc(mx,my,mr,0,7); ctx.fill();
    ctx.fillStyle = 'rgba(190,200,225,0.5)';
    ctx.beginPath(); ctx.arc(mx-mr*0.3,my-mr*0.2,mr*0.22,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+mr*0.25,my+mr*0.3,mr*0.15,0,7); ctx.fill();
    // shooting star
    if(!shoot && t>nextShoot){ shoot={x:rnd()*W*0.7+W*0.15, y:rnd()*H*0.25, vx:-(6+rnd()*4), vy:3+rnd()*2, life:1}; }
    if(shoot){
      shoot.x+=shoot.vx; shoot.y+=shoot.vy; shoot.life-=0.02;
      if(shoot.life<=0){ shoot=null; nextShoot=t+500+rnd()*900; }
      else{
        ctx.strokeStyle='rgba(220,230,255,'+(shoot.life*0.8)+')'; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(shoot.x,shoot.y);
        ctx.lineTo(shoot.x-shoot.vx*8, shoot.y-shoot.vy*8); ctx.stroke();
      }
    }
    // hills
    for(const h of hills){
      ctx.fillStyle=h.c; ctx.beginPath(); ctx.moveTo(0,H);
      h.pts.forEach((y,i)=>ctx.lineTo(i*8,y));
      ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    }
    // grass
    ctx.lineWidth=1.6;
    for(const b of blades){
      const sway = Math.sin(t*0.02*b.s + b.p)*10 + Math.sin(t*0.043+b.p)*3;
      const gx=b.x, gy=H;
      ctx.strokeStyle='hsla('+b.hue+',38%,'+(14+b.h*0.08)+'%,0.9)';
      ctx.beginPath(); ctx.moveTo(gx,gy);
      ctx.quadraticCurveTo(gx+sway*0.4, gy-b.h*0.6, gx+sway, gy-b.h);
      ctx.stroke();
    }
    // fireflies
    for(let i=0;i<flies.length;i++){
      const f=flies[i];
      f.p+=0.02*f.s;
      f.vx += Math.sin(f.p*1.7)*0.008; f.vy += Math.cos(f.p*1.3)*0.008;
      const dx=mouse.x-f.x, dy=mouse.y-f.y, d=Math.hypot(dx,dy);
      if(d<140 && d>1){ f.vx+=dx/d*0.02; f.vy+=dy/d*0.02; }
      f.vx*=0.985; f.vy*=0.985;
      f.x+=f.vx; f.y+=f.vy;
      if(f.x<0||f.x>W||f.y<H*0.3||f.y>H) flies[i]=newFly(false);
      const g=flies[i];
      const blink=Math.pow(Math.max(0,Math.sin(g.p*2.2)),3);
      g.a += ((blink)-g.a)*0.08;
      if(g.a>0.03){
        const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r*5);
        gr.addColorStop(0,'rgba(255,214,130,'+(g.a*0.9)+')');
        gr.addColorStop(1,'rgba(255,190,90,0)');
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(g.x,g.y,g.r*5,0,7); ctx.fill();
        ctx.fillStyle='rgba(255,236,180,'+g.a+')';
        ctx.beginPath(); ctx.arc(g.x,g.y,g.r*0.7,0,7); ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', build);
  addEventListener('pointermove', e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
  addEventListener('pointerleave', ()=>{mouse.x=-9999;mouse.y=-9999;});
  build(); frame();
})();
</script>
</body>
</html>
